   blur included — so any device can undo or erase any step. Both hashes are `hash` fields, so both travel as sync assets.

/* ===== Back-button trap =================================================== */
/* Android/PWA: a fullscreen overlay must be dismissed by Back, not leave the app. */
let backTraps=[],trapSuppress=0;
function onTrapPop(){if(trapSuppress>0){trapSuppress--;return}const t=backTraps.pop();if(!backTraps.length)window.removeEventListener('popstate',onTrapPop);if(t){t.pushed=false;t.close()}}
function pushBackTrap(name,close){const t={name,close,pushed:false};try{history.pushState({trap:name,at:backTraps.length},'');t.pushed=true}catch(e){}backTraps.push(t);if(backTraps.length===1)window.addEventListener('popstate',onTrapPop);return t}
function releaseBackTrap(t){if(!t)return;const i=backTraps.indexOf(t);if(i<0)return;const dropped=backTraps.splice(i);if(!backTraps.length)window.removeEventListener('popstate',onTrapPop);const steps=dropped.filter(x=>x.pushed).length;dropped.forEach(x=>x.pushed=false);if(steps>0){trapSuppress++;setTimeout(()=>{if(trapSuppress>0)trapSuppress--},800);try{history.go(-steps)}catch(e){trapSuppress=Math.max(0,trapSuppress-1)}}}

const peTrap={push:close=>pushBackTrap('photo-editor',close),release:releaseBackTrap};

/* ===== Photo lightbox / gallery ========================================== */
let lightboxZoom=1,lightboxStartDistance=null,lightboxLastTap=0;
let lbList=[],lbIndex=0,lbToken=0,lbTrap=null,lbPanX=0,lbPanY=0,lbDrag=null,lbSuppressClick=false;

function lightboxDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function applyPhotoZoom(){const img=document.getElementById('lightboxImg');if(img){img.style.transform=`translate(${lbPanX}px,${lbPanY}px) scale(${lightboxZoom})`;img.style.cursor=lightboxZoom>1?'grab':'auto'}}
function zoomPhoto(f){lightboxZoom=Math.max(.25,Math.min(8,lightboxZoom*f));if(lightboxZoom<=1){lbPanX=0;lbPanY=0}applyPhotoZoom()}
function resetPhotoZoom(){lightboxZoom=1;lbPanX=0;lbPanY=0;applyPhotoZoom()}

/* Entry points ------------------------------------------------------------ */
/* Single photo (kept for backwards compatibility). */
function openPhotoDataUrl(src,caption='Photo'){return openLightbox([{src,caption}],0)}
/* Saved photo from IndexedDB. `ids` = comma separated gallery of sibling photo ids. */
function openPhotoLightbox(id,ids){const list=(ids?String(ids).split(',').filter(Boolean):[id]).map(x=>({id:x}));const start=Math.max(0,list.findIndex(e=>e.id===id));return openLightbox(list,start)}
/* Not-yet-saved photos in the "add finding" form: read data straight off the DOM cells. */
function openPendingLightbox(btn){const cell=btn.closest('.photo'),grid=btn.closest('.photo-grid');if(!grid)return;const cells=Array.from(grid.children);const list=cells.map(c=>({src:(c._photo&&c._photo.dataUrl)||c.querySelector('img')?.src||'',caption:c.querySelector('[data-caption]')?.value||'New photo'}));return openLightbox(list,Math.max(0,cells.indexOf(cell)))}

/* Core -------------------------------------------------------------------- */
async function openLightbox(list,start=0){
  if(!list||!list.length)return;
  closePhotoLightbox();
  const token=++lbToken;
  lbList=list;lbIndex=start;lightboxZoom=1;lbPanX=0;lbPanY=0;lightboxStartDistance=null;lightboxLastTap=0;lbDrag=null;lbSuppressClick=false;
  const box=document.createElement('div');box.id='photoLightbox';box.className='lightbox';
  box.innerHTML=`<div class="lightbox-bar"><b data-lb-caption>Photo</b><div class="lightbox-actions"><button class="btn small secondary" onclick="zoomPhoto(.8)" aria-label="Zoom out">-</button><button class="btn small secondary" onclick="zoomPhoto(1.25)" aria-label="Zoom in">+</button><button class="btn small secondary" onclick="resetPhotoZoom()">Reset</button><button class="btn small" onclick="closePhotoLightbox()">Close</button></div></div>`
    +`<div class="lightbox-stage"><img id="lightboxImg" alt="Photo"></div>`
    +`<div class="lb-strip" data-lb-strip></div>`
    +`<div class="lightbox-nav" data-lb-nav><button class="btn secondary" onclick="lightboxGo(-1)" aria-label="Previous photo">‹ Prev</button><span class="lightbox-count" data-lb-count></span><button class="btn secondary" onclick="lightboxGo(1)" aria-label="Next photo">Next ›</button></div>`;
  document.body.appendChild(box);
  document.body.classList.add('lb-open');

  const stage=box.querySelector('.lightbox-stage');
  stage.addEventListener('wheel',e=>{e.preventDefault();zoomPhoto(e.deltaY<0?1.12:.89)},{passive:false});
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){e.preventDefault();lightboxStartDistance=lightboxDistance(e.touches[0],e.touches[1]);lbDrag=null}
    else if(e.touches.length===1){const t=e.touches[0];lbDrag={x:t.clientX,y:t.clientY,px:lbPanX,py:lbPanY,moved:false}}
  },{passive:false});
  stage.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&lightboxStartDistance){e.preventDefault();const d=lightboxDistance(e.touches[0],e.touches[1]);if(d>0){zoomPhoto(d/lightboxStartDistance);lightboxStartDistance=d}return}
    if(e.touches.length===1&&lbDrag){
      const t=e.touches[0],dx=t.clientX-lbDrag.x,dy=t.clientY-lbDrag.y;
      if(Math.abs(dx)>8||Math.abs(dy)>8)lbDrag.moved=true;
      if(lightboxZoom>1){e.preventDefault();lbPanX=lbDrag.px+dx;lbPanY=lbDrag.py+dy;applyPhotoZoom()}
      else if(Math.abs(dx)>Math.abs(dy))e.preventDefault();
    }
  },{passive:false});
  stage.addEventListener('touchend',e=>{
    if(e.touches.length<2)lightboxStartDistance=null;
    const d=lbDrag;lbDrag=null;
    if(e.changedTouches.length!==1)return;
    const t=e.changedTouches[0];
    if(d&&d.moved){

      return;
    }
    const n=Date.now();
    if(n-lightboxLastTap<300){e.preventDefault();lbSuppressClick=true;setTimeout(()=>{lbSuppressClick=false},400);lightboxZoom=lightboxZoom===1?2:1;lbPanX=0;lbPanY=0;applyPhotoZoom();lightboxLastTap=0;return}
    lightboxLastTap=n;
  },{passive:false});
  stage.addEventListener('click',e=>{if(e.target===stage&&!lbSuppressClick&&lightboxZoom<=1)closePhotoLightbox()});

  document.addEventListener('keydown',lightboxKey);
  lbTrap=pushBackTrap('lightbox',()=>{lbTrap=null;closePhotoLightbox()});

  await lightboxShow(lbIndex,1);
  lbStrip(token);

function lightboxKey(e){
  if(!document.getElementById('photoLightbox'))return;
  if(e.key==='Escape'){e.preventDefault();closePhotoLightbox()}
  else if(e.key==='ArrowRight'){e.preventDefault();lightboxGo(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();lightboxGo(-1)}
  else if(e.key==='+'||e.key==='='){e.preventDefault();zoomPhoto(1.25)}
  else if(e.key==='-'){e.preventDefault();zoomPhoto(.8)}
  else if(e.key==='0'){e.preventDefault();resetPhotoZoom()}
}

async function lbResolve(n){const e=lbList[n];if(!e)return null;if(e.src)return e;if(!e.id)return null;const p=await loadPhoto(e.id).catch(()=>null);if(!p)return null;e.src=p.dataUrl||p.thumbDataUrl;e.thumb=p.thumbDataUrl||p.dataUrl;e.caption=p.caption||'Photo';return e.src?e:null}

/* Show index n; if that photo is gone, keep stepping in `dir` until one loads. */
async function lightboxShow(n,dir=1){
  const token=lbToken;
  if(!lbList.length)return closePhotoLightbox();
  let i=((n%lbList.length)+lbList.length)%lbList.length;
  for(let k=0;k<lbList.length;k++){
    const e=await lbResolve(i);
    if(token!==lbToken)return;
    if(e){lbIndex=i;resetPhotoZoom();lbRender();return}
    i=((i+dir)%lbList.length+lbList.length)%lbList.length;
  }
  closePhotoLightbox();
}
function lightboxGo(delta){return lightboxShow(lbIndex+delta,delta>=0?1:-1)}

function lbRender(){
  const box=document.getElementById('photoLightbox');if(!box)return;
  const e=lbList[lbIndex]||{},multi=lbList.length>1;
  const img=box.querySelector('#lightboxImg');if(img&&img.getAttribute('src')!==e.src)img.src=e.src||'';
  box.querySelector('[data-lb-caption]').textContent=e.caption||'Photo';
  box.querySelector('[data-lb-count]').textContent=multi?`${lbIndex+1} / ${lbList.length}`:'';
  box.querySelector('[data-lb-nav]').style.display=multi?'':'none';
  box.querySelectorAll('[data-lb-thumb]').forEach(b=>b.classList.toggle('active',Number(b.dataset.lbThumb)===lbIndex));
}

/* Thumbnail filmstrip so any other photo is one tap away. */
async function lbStrip(token){
  const strip=document.querySelector('#photoLightbox [data-lb-strip]');if(!strip)return;
  if(lbList.length<2){strip.style.display='none';return}
  strip.innerHTML='';
  for(let n=0;n<lbList.length;n++){
    const e=lbList[n];
    if(!e.thumb&&e.id){const p=await loadPhoto(e.id).catch(()=>null);if(p)e.thumb=p.thumbDataUrl||p.dataUrl}
    if(token!==lbToken||!document.getElementById('photoLightbox'))return;
    const src=e.thumb||e.src;if(!src)continue;
    const b=document.createElement('button');b.type='button';b.className='lb-thumb'+(n===lbIndex?' active':'');b.dataset.lbThumb=n;
    b.innerHTML=`<img src="${src}" alt="">`;
    b.onclick=()=>lightboxShow(n);
    strip.appendChild(b);
  }
  const cur=strip.querySelector('.lb-thumb.active');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});
}

function closePhotoLightbox(){
  const box=document.getElementById('photoLightbox');
  document.removeEventListener('keydown',lightboxKey);
  if(box)box.remove();
  document.body.classList.remove('lb-open');
  lbToken++;lbList=[];lbIndex=0;lightboxZoom=1;lbPanX=0;lbPanY=0;lbDrag=null;lightboxStartDistance=null;
  const t=lbTrap;lbTrap=null;releaseBackTrap(t);
}

function closeModal(){$('#modal').classList.remove('show');$('#modalBody').innerHTML='';const t=modalTrap;modalTrap=null;releaseBackTrap(t)}function downloadJSON(o,n){downloadText(JSON.stringify(o,null,2),n,'application/json')}function downloadText(t,n,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
init().catch(e=>{console.error(e);document.body.innerHTML='<pre>InspectFlow failed to start: '+esc(e.message||e)+'</pre>'});
</script>
