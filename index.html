<div class="app"><aside class="side no-print"><div class="brand"><div class="logo">IF</div><div><h1>InspectFlow</h1><p>v0.5 photo-first</p></div></div><nav class="nav" id="nav"><button data-view="home" class="active">🏠 Dashboard</button><button data-view="templates">🧩 Templates</button><button data-view="start">▶️ Start inspection</button><button data-view="archive">📚 Archive</button><button data-view="reports">📄 Reports</button><button data-view="backup">💾 Backup / sync</button></nav><div class="syncbox"><span class="dot"></span><b>Local first</b><br><span>Deletes use tombstones. No more resurrection.</span><div class="sync-status" id="syncStatus">Local only</div></div></aside><main class="main" id="app"></main></div><button class="btn mobile-fab no-print" id="quickAdd">+ Finding</button><div class="modal" id="modal"><div class="dialog"><header><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">✕</button></header><div class="body" id="modalBody"></div><footer id="modalFooter"></footer></div></div><input id="importFile" type="file" accept="application/json" class="hidden">
<script>
'use strict';
const APP_VERSION='0.5.0', LS_TEMPLATES='inspectflow.templates.v2', LS_SETTINGS='inspectflow.settings.v2', LS_TOMBSTONES='inspectflow.tombstones.v2', DB_NAME='InspectFlowDBv2', DB_VERSION=1;
let db=null,deferredInstallPrompt=null,state={view:'home',templates:[],inspections:[],currentInspectionId:null,reportInspectionId:null,settings:{supabaseEnabled:false,supabaseUrl:'',supabaseAnonKey:'',syncPhotos:true},sync:{running:false,pending:false,lastStatus:'Local only',lastAt:null,lastError:''}};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8), now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), br=s=>esc(s).replace(/\n/g,'<br>'), fmt=d=>d?new Date(d).toLocaleString():'', risk=r=>String(r||'').toLowerCase().replace(/\s+/g,''), safe=s=>String(s||'export').replace(/[^a-z0-9_-]+/gi,'_').slice(0,80), liveTemplates=()=>state.templates.filter(t=>!t.deletedAt);
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('inspections'))d.createObjectStore('inspections',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});};q.onsuccess=()=>{db=q.result;res(db)};q.onerror=()=>rej(q.error);})}
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);function all(n){return new Promise((res,rej)=>{const r=store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function get(n,id){return new Promise((res,rej)=>{const r=store(n).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(n,o){return new Promise((res,rej)=>{const r=store(n,'readwrite').put(o);r.onsuccess=()=>res(o);r.onerror=()=>rej(r.error)})}function del(n,id){return new Promise((res,rej)=>{const r=store(n,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function defaultTemplates(){const mk=(name,category,help,classifications,fields=[])=>({id:uid('tpl'),name,description:'Deviation-based inspection template.',version:'1.0',owner:'SHE',category,active:true,department:'',help,fields,classifications,riskLevels:['Low','Medium','High','Critical'],createdAt:now(),updatedAt:now(),syncStatus:'local'});return[
mk('General SHE Inspection','Safety / Environment',{purpose:'Find and record relevant deviations, positive observations and improvement opportunities. Not a checklist.',look:'Blocked emergency routes\nDamaged guarding\nLeakage or spill risks\nTrip hazards\nUnsafe temporary situations\nMissing signage\nGood practices worth sharing',dev:'Housekeeping issues\nFire doors blocked\nPPE deviations\nMissing labels\nUnclear temporary controls',ref:'Internal SHE procedures\nISO 14001 / ISO 45001 context where relevant',esc:'Escalate immediately for critical risk, environmental release, fire risk or serious injury potential.'},['Unsafe condition','Unsafe behavior','Housekeeping','Machine safety','Fire safety','Environmental','Contractor safety','Positive observation','Improvement opportunity'],[{id:uid('fld'),label:'Equipment / asset number',type:'shortText',required:false},{id:uid('fld'),label:'Legal / procedure reference',type:'shortText',required:false}]),
mk('Chemical Storage / PGS 15 Round','Chemicals / Environment',{purpose:'Focus on containment, compatibility, labelling, leakage and emergency readiness.',look:'Packaging integrity\nLeaks or staining\nSegregation\nSpill containment\nLabels and SDS references\nSpill kits\nBlocked routes\nWaste chemicals',dev:'Open containers\nDamaged IBC/drums\nIncorrect segregation\nMissing labels\nInsufficient containment',ref:'PGS 15\nBAL / permit context\nInternal chemical storage rules',esc:'Escalate immediately for active leakage, incompatible storage, unknown chemicals or blocked emergency equipment.'},['Packaging damage','Leakage/spillage','Incorrect segregation','Missing label','Missing SDS/reference','Insufficient containment','Incompatible storage','Housekeeping','Fire safety','Emergency equipment'],[{id:uid('fld'),label:'Substance / product name',type:'shortText'},{id:uid('fld'),label:'Packaging type',type:'dropdown',options:['IBC','Drum','Jerrycan','Small packaging','Waste container']},{id:uid('fld'),label:'Estimated quantity',type:'shortText'}]),
mk('Contractor Work Area Inspection','Contractor safety',{purpose:'Verify that contractor work matches agreed controls and log deviations quickly.',look:'Work matches permit\nLOTOTO/isolation clarity\nDemarcation\nWorking at height controls\nHot work controls\nTool condition\nPPE use\nHousekeeping',dev:'Permit scope mismatch\nMissing demarcation\nPoor housekeeping\nUnclear isolation\nHot work controls incomplete',ref:'Work permit procedure\nLOTOTO procedure\nContractor safety rules',esc:'Stop and escalate if immediate danger, permit violation, or critical controls are missing.'},['Permit deviation','LOTOTO issue','Working at height','Hot work','Housekeeping','Unsafe tools/equipment','PPE deviation','Environmental risk','Supervision issue'],[{id:uid('fld'),label:'Permit number',type:'shortText'},{id:uid('fld'),label:'Contractor company',type:'shortText'},{id:uid('fld'),label:'Work type',type:'multiSelect',options:['Hot work','Working at height','LOTOTO','Confined space','Excavation','Lifting','Electrical work']}])];}
function loadTemplates(){try{state.templates=JSON.parse(localStorage.getItem(LS_TEMPLATES)||'null')||defaultTemplates()}catch{state.templates=defaultTemplates()}saveTemplates()}function saveTemplates(){localStorage.setItem(LS_TEMPLATES,JSON.stringify(state.templates))}function loadSettings(){try{state.settings={...state.settings,...JSON.parse(localStorage.getItem(LS_SETTINGS)||'{}')}}catch{}}function saveSettings(){localStorage.setItem(LS_SETTINGS,JSON.stringify(state.settings));syncIndicator()}function tomb(){try{return JSON.parse(localStorage.getItem(LS_TOMBSTONES)||'[]')}catch{return[]}}function saveTomb(x){localStorage.setItem(LS_TOMBSTONES,JSON.stringify(x))}function addTomb(id,type,deletedAt=now()){const x=tomb().filter(t=>t.id!==id);x.push({id,type,updated_at:deletedAt,deleted_at:deletedAt});saveTomb(x);scheduleSync()}
async function refresh(){state.inspections=(await all('inspections')).filter(i=>!i.deletedAt).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)))}
async function init(){setupPWA();await openDB();loadTemplates();loadSettings();await refresh();bind();render();syncIndicator();window.addEventListener('online',scheduleSync);setInterval(scheduleSync,60000);scheduleSync()}function bind(){$$('#nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.currentInspectionId=null;render()});$('#quickAdd').onclick=()=>{if(state.currentInspectionId)editFinding()};$('#importFile').onchange=importFile}
function nav(){ $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view)) }function page(t,sub,actions='',body=''){ $('#app').innerHTML=`<div class="top"><div><h2>${t}</h2><p>${sub||''}</p></div><div class="actions no-print">${actions}</div></div>${body}` }function render(){nav();$('#quickAdd').style.display=state.currentInspectionId?'block':'none';({home,templates,start,archive,reports,backup}[state.view]||home)()}function setView(v){state.view=v;render()}function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function home(){const fs=state.inspections.flatMap(i=>i.findings||[]);page('Dashboard','Offline deviation logging for SHE inspections.',`<button class="btn" onclick="setView('start')">Start inspection</button><button class="btn secondary" onclick="setView('templates')">Manage templates</button>`,`<div class="grid"><div class="card span12 install-card no-print"><div class="section-title"><div><h3>Android home screen / fullscreen</h3><p class="hint">When hosted on GitHub Pages over HTTPS, use this button to install InspectFlow as a standalone app.</p></div><button class="btn" onclick="installApp()">Install / add to home screen</button></div><div class="hint">Status: ${isStandalone()?'running standalone/fullscreen':'browser tab mode'}</div></div><div class="card span3"><div class="num">${liveTemplates().filter(t=>t.active).length}</div><div class="lbl">Active templates</div></div><div class="card span3"><div class="num">${state.inspections.filter(i=>i.status!=='completed').length}</div><div class="lbl">Open inspections</div></div><div class="card span3"><div class="num">${state.inspections.filter(i=>i.status==='completed').length}</div><div class="lbl">Completed</div></div><div class="card span3"><div class="num">${fs.filter(f=>['High','Critical'].includes(f.riskLevel)).length}</div><div class="lbl">High / critical</div></div><div class="card span8"><div class="section-title"><h3>Recent inspections</h3><button class="btn small secondary" onclick="setView('archive')">View all</button></div>${inspectionTable(state.inspections.slice(0,6))}</div><div class="card span4"><h3>Storage & sync</h3><div class="kpis"><div class="kpi"><span>Sync</span><span class="badge info">${esc(state.settings.supabaseEnabled?state.sync.lastStatus:'Local only')}</span></div><div class="kpi"><span>Pending tombstones</span><b>${pendingDeleteCount()}</b></div><div class="kpi"><span>App</span><b>${APP_VERSION}</b></div></div><p class="hint">v0.4 uses soft deletes/tombstones for templates, inspections and photos.</p></div></div>`)}
function pendingDeleteCount(){return tomb().length + state.templates.filter(t=>t.deletedAt).length + state.inspections.filter(i=>i.deletedAt).length}
function inspectionTable(list){if(!list.length)return`<div class="empty">No inspections yet.</div>`;return`<table class="table"><thead><tr><th>Inspection</th><th>Template</th><th>Status</th><th>Findings</th><th>Updated</th><th></th></tr></thead><tbody>${list.map(i=>`<tr><td><b>${esc(i.title)}</b><br><span class="hint">${esc(i.area||'')}</span></td><td>${esc(i.templateName||liveTemplates().find(t=>t.id===i.templateId)?.name||'Template removed')}</td><td><span class="badge ${i.status==='completed'?'low':'info'}">${esc(i.status)}</span></td><td>${(i.findings||[]).length}</td><td>${fmt(i.updatedAt)}</td><td class="actions"><button class="btn small" onclick="openInspection('${i.id}')">Open</button><button class="btn small danger" onclick="deleteInspection('${i.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`}
function templates(){const showDeleted=false; const list=showDeleted?state.templates:liveTemplates();page('Templates','Build flexible templates with guidance, classification and custom finding fields.',`<button class="btn" onclick="editTemplate()">New template</button>`,`<div class="card"><table class="table"><thead><tr><th>Name</th><th>Category</th><th>Version</th><th>Fields</th><th>Status</th><th></th></tr></thead><tbody>${list.map(t=>`<tr class="${t.deletedAt?'deleted-row':''}"><td><b>${esc(t.name)}</b><br><span class="hint">${esc(t.description||'')}</span></td><td>${esc(t.category||'')}</td><td>${esc(t.version||'')}</td><td>${t.fields?.length||0}</td><td><span class="badge ${t.deletedAt?'critical':t.active?'low':'medium'}">${t.deletedAt?'Deleted':t.active?'Active':'Inactive'}</span></td><td class="actions"><button class="btn small" onclick="editTemplate('${t.id}')">Edit</button><button class="btn small secondary" onclick="toggleTemplateActive('${t.id}')">${t.active?'Archive':'Activate'}</button><button class="btn small secondary" onclick="dupTemplate('${t.id}')">Duplicate</button><button class="btn small secondary" onclick="exportTemplate('${t.id}')">Export</button><button class="btn small danger" onclick="deleteTemplate('${t.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`)}

function reports(){page('Reports','Professional compact report preview and browser print/PDF export.','',`<div class="card"><div class="field"><label>Select inspection</label><select id="reportSelect" onchange="generateReport(this.value)"><option value="">Choose...</option>${state.inspections.map(i=>`<option value="${i.id}">${esc(i.title)} (${esc(i.status)})</option>`).join('')}</select></div><div id="reportHost" style="margin-top:16px"></div></div>`);if(state.reportInspectionId)generateReport(state.reportInspectionId,false)}async function reportHtml(i){const t=state.templates.find(x=>x.id===i.templateId)||{},fs=i.findings||[],cnt={Low:0,Medium:0,High:0,Critical:0};fs.forEach(f=>{if(cnt[f.riskLevel]!=null)cnt[f.riskLevel]++});let cards='';for(let n=0;n<fs.length;n++){const f=fs[n],ps=[];for(const pid of f.photoIds||[]){const p=await get('photos',pid);if(p&&!p.deletedAt)ps.push(p)}cards+=`<article class="report-card"><h3>${n+1}. ${esc(f.title||'(Untitled)')}</h3><div class="chips"><span class="badge ${risk(f.riskLevel)}">${esc(f.riskLevel||'-')}</span><span class="badge">${esc(f.classification||'-')}</span><span class="badge info">${esc(f.status||'-')}</span></div><div class="compact"><span><b>Location:</b> ${esc(f.location||i.area||'-')}</span><span><b>Owner/due:</b> ${esc(f.owner||'-')} / ${esc(f.dueDate||'-')}</span>${f.description?`<span><b>Details:</b> ${esc(f.description)}</span>`:''}${f.immediateAction?`<span><b>Immediate:</b> ${esc(f.immediateAction)}</span>`:''}${f.proposedAction?`<span><b>Action:</b> ${esc(f.proposedAction)}</span>`:''}</div>${ps.length?`<div class="photo-grid">${ps.slice(0,4).map(p=>`<div class="photo"><img src="${p.dataUrl}"><div style="padding:6px;font-size:11px">${esc(p.caption||'')}</div></div>`).join('')}</div>`:''}</article>`}return`<div class="report"><div class="report-cover"><h1>${esc(i.title)}</h1><p><b>Template:</b> ${esc(i.templateName||t.name||'Template removed')} · <b>Generated:</b> ${fmt(now())}</p></div><div class="report-grid"><div class="report-stat"><span>Findings</span><b>${fs.length}</b></div><div class="report-stat"><span>High</span><b>${cnt.High||0}</b></div><div class="report-stat"><span>Critical</span><b>${cnt.Critical||0}</b></div><div class="report-stat"><span>Status</span><b style="font-size:18px">${esc(i.status)}</b></div></div><h2>Inspection details</h2><table class="table"><tbody><tr><th>Auditor</th><td>${esc(i.auditor||'-')}</td><th>Department</th><td>${esc(i.department||'-')}</td></tr><tr><th>Area</th><td>${esc(i.area||'-')}</td><th>Participants</th><td>${esc(i.participants||'-')}</td></tr><tr><th>Started</th><td>${fmt(i.startedAt)}</td><th>Completed</th><td>${fmt(i.completedAt)||'-'}</td></tr></tbody></table><h2>Summary table</h2>${fs.length?`<table class="table"><thead><tr><th>#</th><th>Finding</th><th>Class</th><th>Risk</th><th>Location</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${fs.map((f,n)=>`<tr><td>${n+1}</td><td>${esc(f.title||'(Untitled)')}</td><td>${esc(f.classification)}</td><td><span class="badge ${risk(f.riskLevel)}">${esc(f.riskLevel)}</span></td><td>${esc(f.location||'')}</td><td>${esc(f.owner||'')}</td><td>${esc(f.dueDate||'')}</td><td>${esc(f.status||'')}</td></tr>`).join('')}</tbody></table>`:'<p>No findings.</p>'}<h2>Detailed findings</h2><div class="report-card-grid">${cards}</div><h2>Appendix - auditor guidance</h2>${helpHtml(t)}<p class="hint">Generated by InspectFlow v${APP_VERSION}. Data source: local browser storage.</p></div>`}async function generateReport(id,change=true){state.reportInspectionId=id;if(change&&state.view!=='reports'){state.view='reports';return render()}const host=$('#reportHost');if(!id||!host)return;const i=state.inspections.find(x=>x.id===id);host.innerHTML=`<div class="toolbar no-print"><button class="btn" onclick="window.print()">Print / save PDF</button><button class="btn secondary" onclick="exportInspection('${id}')">Export JSON</button><button class="btn secondary" onclick="exportCSV('${id}')">Export CSV</button></div><div class="card" style="margin-top:12px">${await reportHtml(i)}</div>`;const s=$('#reportSelect');if(s)s.value=id}
async function exportInspection(id){const i=state.inspections.find(x=>x.id===id),photos=[];for(const f of i.findings||[])for(const pid of f.photoIds||[]){const p=await get('photos',pid);if(p&&!p.deletedAt)photos.push(p)}downloadJSON({type:'InspectFlowInspectionExport',version:APP_VERSION,inspection:i,photos},`InspectFlow_inspection_${safe(i.title)}.json`)}function exportCSV(id){const i=state.inspections.find(x=>x.id===id),rows=[['Inspection','Finding','Classification','Risk','Location','Owner','Due date','Status','Description','Immediate action','Proposed action']];(i.findings||[]).forEach(f=>rows.push([i.title,f.title,f.classification,f.riskLevel,f.location,f.owner,f.dueDate,f.status,f.description,f.immediateAction,f.proposedAction]));downloadText(rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'),`InspectFlow_findings_${safe(i.title)}.csv`,'text/csv')}
function backup(){page('Backup / sync','Export backups, import data, configure Supabase sync, and repair sync state.','',`<div class="grid"><div class="card span6"><h3>Export</h3><p>Download all templates, inspections and photos as one JSON backup.</p><button class="btn" onclick="exportAll()">Export full backup</button></div><div class="card span6"><h3>Import</h3><p>Import a backup, inspection export or template JSON.</p><button class="btn secondary" onclick="$('#importFile').click()">Import JSON</button></div><div class="card span12 install-card"><h3>Install on Android</h3><p class="hint">After publishing this file on GitHub Pages, open it in Chrome and use the button below.</p><button class="btn" onclick="installApp()">Install / add to home screen</button></div><div class="card span12"><h3>Supabase sync</h3><p class="hint">v0.4 fixes template deletion resurrection by using durable tombstones and upsert conflict handling.</p>${syncForm()}<div class="toolbar"><button class="btn" onclick="saveSync()">Save sync settings</button><button class="btn secondary" onclick="syncNow(true)">Sync now</button><button class="btn warn" onclick="replaceLocalTemplatesFromRemote()">Repair: replace local templates from Supabase</button><button class="btn danger" onclick="clearLocalDeletedRecords()">Cleanup acknowledged deletes</button></div><div class="warnbox" style="margin-top:12px"><b>Required table</b><pre class="mono" style="white-space:pre-wrap">create table if not exists inspectflow_records (\n  id text primary key,\n  type text not null,\n  payload jsonb not null,\n  updated_at timestamptz not null,\n  deleted_at timestamptz\n);</pre><b>Important:</b> do not hard-delete rows in Supabase. If needed, set <span class="mono">deleted_at = now()</span>. Use the repair button once to clean a device after manual hard-deletes.</div><div class="ok" style="margin-top:12px"><b>Sync diagnostics</b><br>Live templates: ${liveTemplates().length} · Deleted local templates pending/kept: ${state.templates.filter(t=>t.deletedAt).length} · Pending tombstones: ${tomb().length} · Last error: ${esc(state.sync.lastError||'-')}</div></div><div class="card span12 warnbox"><b>Important:</b> keep backup export available even after sync is enabled.</div></div>`)}function syncForm(){return`<form id="syncForm" class="form" onsubmit="return false"><div class="row"><div class="field"><label>Enable Supabase sync</label><select name="supabaseEnabled"><option value="false" ${!state.settings.supabaseEnabled?'selected':''}>No</option><option value="true" ${state.settings.supabaseEnabled?'selected':''}>Yes</option></select></div><div class="field"><label>Sync photos</label><select name="syncPhotos"><option value="true" ${state.settings.syncPhotos?'selected':''}>Yes</option><option value="false" ${!state.settings.syncPhotos?'selected':''}>No, metadata only</option></select></div></div><div class="field"><label>Project URL</label><input name="supabaseUrl" placeholder="https://your-project.supabase.co" value="${esc(state.settings.supabaseUrl||'')}"></div><div class="field"><label>Anon/publishable key</label><input name="supabaseAnonKey" type="password" value="${esc(state.settings.supabaseAnonKey||'')}"></div></form>`}function saveSync(){const f=$('#syncForm');state.settings.supabaseEnabled=f.elements.supabaseEnabled.value==='true';state.settings.syncPhotos=f.elements.syncPhotos.value==='true';state.settings.supabaseUrl=f.elements.supabaseUrl.value.trim().replace(/\/$/,'');state.settings.supabaseAnonKey=f.elements.supabaseAnonKey.value.trim();saveSettings();scheduleSync();alert('Sync settings saved.');render()}
function syncIndicator(){const e=$('#syncStatus');if(e)e.textContent=(state.settings.supabaseEnabled?state.sync.lastStatus:'Local only')+(state.sync.lastAt?' · '+new Date(state.sync.lastAt).toLocaleTimeString():'')}function scheduleSync(){if(!state.settings.supabaseEnabled)return;state.sync.pending=true;setTimeout(()=>syncNow().catch(()=>{}),50)}function sbHeaders(){return{'apikey':state.settings.supabaseAnonKey,'Authorization':'Bearer '+state.settings.supabaseAnonKey,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}}async function sb(path,opt={}){return fetch(state.settings.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+path,{...opt,headers:{...sbHeaders(),...(opt.headers||{})}})}
async function syncNow(manual=false){if(!state.settings.supabaseEnabled||!state.settings.supabaseUrl||!state.settings.supabaseAnonKey)return;if(state.sync.running){state.sync.pending=true;return}if(!navigator.onLine){state.sync.lastStatus='Offline - pending';syncIndicator();return}state.sync.running=true;state.sync.pending=false;state.sync.lastStatus='Syncing...';state.sync.lastError='';syncIndicator();try{const activeView=state.view, activeInspectionId=state.currentInspectionId;await refresh();const r=await sb('inspectflow_records?select=*',{method:'GET'});if(!r.ok)throw new Error('Supabase pull '+r.status+' '+await r.text());await applyRemote(await r.json());const rec=await localRecords();for(let i=0;i<rec.length;i+=50){const q=await sb('inspectflow_records?on_conflict=id',{method:'POST',body:JSON.stringify(rec.slice(i,i+50))});if(!q.ok)throw new Error('Supabase push '+q.status+' '+await q.text())}state.view=activeView;state.currentInspectionId=activeInspectionId;state.sync.lastAt=now();state.sync.lastStatus='Synced';saveTomb([]);await refresh();}catch(e){console.warn(e);state.sync.lastStatus='Sync failed - local safe';state.sync.lastError=String(e.message||e).slice(0,250)}finally{state.sync.running=false;syncIndicator();if(state.sync.pending)setTimeout(()=>syncNow().catch(()=>{}),1000)}}async function localRecords(){const a=[];for(const t of state.templates){if(t.deletedAt){a.push({id:t.id,type:'template',payload:{id:t.id,deletedAt:t.deletedAt},updated_at:t.updatedAt||t.deletedAt,deleted_at:t.deletedAt})}else{a.push({id:t.id,type:'template',payload:t,updated_at:t.updatedAt||now(),deleted_at:null})}}for(const i of await all('inspections')){if(i.deletedAt)a.push({id:i.id,type:'inspection',payload:{id:i.id,deletedAt:i.deletedAt},updated_at:i.updatedAt||i.deletedAt,deleted_at:i.deletedAt});else a.push({id:i.id,type:'inspection',payload:i,updated_at:i.updatedAt||now(),deleted_at:null})}if(state.settings.syncPhotos){for(const p of await all('photos')){if(p.deletedAt)a.push({id:p.id,type:'photo',payload:{id:p.id,deletedAt:p.deletedAt},updated_at:p.updatedAt||p.deletedAt,deleted_at:p.deletedAt});else a.push({id:p.id,type:'photo',payload:p,updated_at:p.updatedAt||p.createdAt||now(),deleted_at:null})}}for(const d of tomb()){if(!a.some(x=>x.id===d.id))a.push({id:d.id,type:d.type,payload:{id:d.id,deletedAt:d.deleted_at},updated_at:d.updated_at,deleted_at:d.deleted_at})}return a}async function applyRemote(rs){const rows=rs||[];for(const r of rows.filter(x=>x.deleted_at)){if(r.type==='template'){state.templates=state.templates.filter(t=>t.id!==r.id);saveTemplates()}else if(r.type==='inspection'){await del('inspections',r.id)}else if(r.type==='photo'){await del('photos',r.id)}}for(const r of rows.filter(x=>!x.deleted_at)){if(!r.payload)continue;if(r.type==='template'){const local=state.templates.find(t=>t.id===r.id);if(local?.deletedAt && String(local.updatedAt||local.deletedAt)>=String(r.updated_at||''))continue;if(!local||String(r.updated_at)>String(local.updatedAt||'')){const idx=state.templates.findIndex(t=>t.id===r.id);idx>=0?state.templates[idx]=r.payload:state.templates.push(r.payload);saveTemplates()}}else if(r.type==='inspection'){const local=await get('inspections',r.id);if(local?.deletedAt && String(local.updatedAt||local.deletedAt)>=String(r.updated_at||''))continue;if(!local||String(r.updated_at)>String(local.updatedAt||''))await put('inspections',r.payload)}else if(r.type==='photo'&&state.settings.syncPhotos){const local=await get('photos',r.id);if(local?.deletedAt && String(local.updatedAt||local.deletedAt)>=String(r.updated_at||''))continue;if(!local||String(r.updated_at)>String(local.updatedAt||''))await put('photos',r.payload)}}saveTemplates()}
async function replaceLocalTemplatesFromRemote(){if(!confirm('Replace local template cache with templates currently present in Supabase? This is useful after manual hard-deletes in Supabase. Local inspections are not changed.'))return;if(!state.settings.supabaseEnabled||!state.settings.supabaseUrl||!state.settings.supabaseAnonKey){alert('Enable and save Supabase settings first.');return}try{const r=await sb("inspectflow_records?type=eq.template&select=*",{method:'GET'});if(!r.ok)throw new Error(await r.text());const rows=await r.json();state.templates=rows.filter(x=>!x.deleted_at&&x.payload).map(x=>x.payload);saveTemplates();saveTomb(tomb().filter(x=>x.type!=='template'));state.sync.lastStatus='Templates replaced from remote';syncIndicator();render()}catch(e){alert('Repair failed: '+(e.message||e))}}
async function clearLocalDeletedRecords(){if(!confirm('Cleanup local deleted records/tombstones? Only use this after a successful sync.'))return;state.templates=state.templates.filter(t=>!t.deletedAt);saveTemplates();saveTomb([]);for(const i of await all('inspections'))if(i.deletedAt)await del('inspections',i.id);for(const p of await all('photos'))if(p.deletedAt)await del('photos',p.id);await refresh();render()}
let lightboxZoom=1;function openPhotoDataUrl(src,caption='Photo'){const old=document.getElementById('photoLightbox');if(old)old.remove();lightboxZoom=1;const box=document.createElement('div');box.id='photoLightbox';box.className='lightbox';box.innerHTML=`<div class="lightbox-bar"><b>${esc(caption||'Photo')}</b><div class="lightbox-actions"><button class="btn small secondary" onclick="zoomPhoto(.8)">-</button><button class="btn small secondary" onclick="zoomPhoto(1.25)">+</button><button class="btn small secondary" onclick="resetPhotoZoom()">Reset</button><button class="btn small" onclick="closePhotoLightbox()">Close</button></div></div><div class="lightbox-stage" onclick="if(event.target.classList.contains('lightbox-stage'))closePhotoLightbox()"><img id="lightboxImg" src="${src}" alt="Photo"></div>`;document.body.appendChild(box);box.querySelector('.lightbox-stage').addEventListener('wheel',e=>{e.preventDefault();zoomPhoto(e.deltaY<0?1.12:.89)},{passive:false})}async function openPhotoLightbox(id){const p=await get('photos',id);if(p&&!p.deletedAt)openPhotoDataUrl(p.dataUrl,p.caption||'Photo')}function zoomPhoto(f){lightboxZoom=Math.max(.2,Math.min(8,lightboxZoom*f));const img=document.getElementById('lightboxImg');if(img)img.style.transform=`scale(${lightboxZoom})`}function resetPhotoZoom(){lightboxZoom=1;const img=document.getElementById('lightboxImg');if(img)img.style.transform='scale(1)'}function closePhotoLightbox(){const box=document.getElementById('photoLightbox');if(box)box.remove()}  
function setupPWA(){try{const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0f766e"/><text x="256" y="312" text-anchor="middle" font-size="180" font-family="Arial" font-weight="700" fill="white">IF</text></svg>';const icon='data:image/svg+xml;base64,'+btoa(svg);const manifest={name:'InspectFlow',short_name:'InspectFlow',start_url:'./',scope:'./',display:'standalone',orientation:'portrait',theme_color:'#0f766e',background_color:'#f6f7fb',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.appendChild(link);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});if('serviceWorker' in navigator && location.protocol.startsWith('http')){const sw=`const CACHE='inspectflow-v0-4';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])));self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});self.addEventListener('fetch',e=>{if(e.request.method==='GET')e.respondWith(fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./'))))})`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{})}}catch(e){console.warn('PWA setup skipped',e)}}async function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice.catch(()=>{});deferredInstallPrompt=null;return}openModal('Install InspectFlow on Android',`<div class="form"><p><b>If the native install prompt is not shown:</b></p><ol><li>Host this HTML file on GitHub Pages over HTTPS.</li><li>Open the GitHub Pages URL in Chrome on Android.</li><li>Tap the Chrome menu ⋮.</li><li>Choose <b>Add to Home screen</b> or <b>Install app</b>.</li></ol><p class="hint">The page includes an embedded manifest with <b>display: standalone</b> and a service worker for offline caching when served over HTTPS.</p></div>`,`<button class="btn" onclick="closeModal()">Close</button>`)}
async function exportAll(){downloadJSON({type:'InspectFlowFullBackup',version:APP_VERSION,exportedAt:now(),templates:state.templates,inspections:await all('inspections'),photos:await all('photos')},`InspectFlow_full_backup_${new Date().toISOString().slice(0,10)}.json`)}async function importFile(e){const f=e.target.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch{alert('Invalid JSON');return}if(d.type==='InspectFlowFullBackup'){state.templates=d.templates||state.templates;saveTemplates();for(const i of d.inspections||[])await put('inspections',i);for(const p of d.photos||[])await put('photos',p);await refresh();scheduleSync();alert('Full backup imported.')}else if(d.type==='InspectFlowInspectionExport'){await put('inspections',d.inspection);for(const p of d.photos||[])await put('photos',p);await refresh();scheduleSync();alert('Inspection imported.')}else if(d.name&&d.fields&&d.classifications){d.updatedAt=now();d.deletedAt=null;const idx=state.templates.findIndex(t=>t.id===d.id);idx>=0?state.templates[idx]=d:state.templates.push(d);saveTemplates();scheduleSync();alert('Template imported.')}else alert('JSON type not recognized.');e.target.value='';render()}
function openModal(t,b,f){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modalFooter').innerHTML=f;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function downloadJSON(o,n){downloadText(JSON.stringify(o,null,2),n,'application/json')}function downloadText(t,n,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
init().catch(e=>{console.error(e);document.body.innerHTML='<pre>InspectFlow failed to start: '+esc(e.message||e)+'</pre>'});
