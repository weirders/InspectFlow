<script>
'use strict';
const APP_VERSION='0.8.0', APP='inspectflow', LS_TEMPLATES='inspectflow.templates.v2', LS_TOMBSTONES='inspectflow.tombstones.v2', LEGACY_DB='InspectFlowDBv2';
let deferredInstallPrompt=null,state={view:'home',templates:[],inspections:[],currentInspectionId:null,reportInspectionId:null,sync:{s:null}};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8), now=()=>new Date().toISOString(), S=()=>window.SfhaSync, newId=()=>{try{if(S().util&&S().util.uid)return S().util.uid()}catch{}return crypto.randomUUID?crypto.randomUUID():uid('r')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), br=s=>esc(s).replace(/\n/g,'<br>'), fmt=d=>d?new Date(d).toLocaleString():'', risk=r=>String(r||'').toLowerCase().replace(/\s+/g,''), safe=s=>String(s||'export').replace(/[^a-z0-9_-]+/gi,'_').slice(0,80), liveTemplates=()=>state.templates.filter(t=>!t.deletedAt);
/* ===== sfha-sync adapters — the shared DB is the single source of truth; state.templates/state.inspections are read caches refreshed on every change ===== */
const recToObj=r=>({...r.payload,id:r.id,updatedAt:r.updatedAt||r.payload?.updatedAt,deletedAt:r.deleted?r.updatedAt:null});
async function listColl(coll){return (await S().list(APP,coll)).map(recToObj)}
async function getObj(coll,id){const r=await S().get(APP,coll,id);return r&&!r.deleted?recToObj(r):undefined}
async function putObj(coll,o){const {deletedAt,dataUrl,pendingAsset,syncStatus,lastSyncedAt,storagePath,path,bucket,...payload}=o;const r=await S().put(APP,coll,{id:o.id,payload});return recToObj(r)}
async function delObj(coll,id){await S().del(APP,coll,id)}
/* Photos: metadata + 320px thumbnail live in the record; the full-size JPEG is a content-addressed asset referenced by payload.hash. */
const assetUrls=new Map();
async function assetUrl(hash){if(!hash)return'';if(assetUrls.has(hash))return assetUrls.get(hash);const b=await S().getAsset(hash).catch(()=>null);if(!b)return'';const u=URL.createObjectURL(b);assetUrls.set(hash,u);return u}
async function hydratePhoto(p){const full=await assetUrl(p.hash);p.dataUrl=full||p.thumbDataUrl||'';p.thumbDataUrl=p.thumbDataUrl||p.dataUrl;p.pendingAsset=!!p.hash&&!full;return p}
async function loadPhoto(id){const p=await getObj('photos',id);return p?hydratePhoto(p):null}
async function loadPhotos(ids){const out=[];for(const id of ids||[]){const p=await loadPhoto(id);if(p)out.push(p)}return out}
const dataUrlToBlob=async d=>await(await fetch(d)).blob();
const blobToDataUrl=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
async function storePhoto(p){let hash=p.hash||null,size=p.size||0;if(p.dataUrl&&p.dataUrl.startsWith('data:')){const b=await dataUrlToBlob(p.dataUrl);hash=await S().putAsset(b);size=b.size}return putObj('photos',{...p,hash,size,mime:p.type||'image/jpeg'})}
async function tombPhoto(id){await delObj('photos',id)}
async function exportablePhoto(p){const b=p.hash?await S().getAsset(p.hash).catch(()=>null):null;const {pendingAsset,...rest}=p;return{...rest,dataUrl:b?await blobToDataUrl(b):(p.thumbDataUrl||'')}}
/* Legacy (pre-0.8) storage — read once by the migration below and never again. */
function openLegacyDB(){return new Promise((res,rej)=>{const q=indexedDB.open(LEGACY_DB,1);q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('inspections'))d.createObjectStore('inspections',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function legacyAll(d,n){return new Promise((res,rej)=>{const r=d.transaction(n).objectStore(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function legacyTomb(){try{return JSON.parse(localStorage.getItem(LS_TOMBSTONES)||'[]')}catch{return[]}}
function defaultTemplates(){const mk=(name,category,help,classifications,fields=[])=>({id:newId(),name,description:'Deviation-based inspection template.',version:'1.0',owner:'SHE',category,active:true,department:'',help,fields,classifications,riskLevels:['Low','Medium','High','Critical'],createdAt:now(),updatedAt:now(),syncStatus:'local'});return[
mk('General SHE Inspection','Safety / Environment',{purpose:'Find and record relevant deviations, positive observations and improvement opportunities. Not a checklist.',look:'Blocked emergency routes\nDamaged guarding\nLeakage or spill risks\nTrip hazards\nUnsafe temporary situations\nMissing signage\nGood practices worth sharing',dev:'Housekeeping issues\nFire doors blocked\nPPE deviations\nMissing labels\nUnclear temporary controls',ref:'Internal SHE procedures\nISO 14001 / ISO 45001 context where relevant',esc:'Escalate immediately for critical risk, environmental release, fire risk or serious injury potential.'},['Unsafe condition','Unsafe behavior','Housekeeping','Machine safety','Fire safety','Environmental','Contractor safety','Positive observation','Improvement opportunity'],[{id:uid('fld'),label:'Equipment / asset number',type:'shortText',required:false},{id:uid('fld'),label:'Legal / procedure reference',type:'shortText',required:false}]),
mk('Chemical Storage / PGS 15 Round','Chemicals / Environment',{purpose:'Focus on containment, compatibility, labelling, leakage and emergency readiness.',look:'Packaging integrity\nLeaks or staining\nSegregation\nSpill containment\nLabels and SDS references\nSpill kits\nBlocked routes\nWaste chemicals',dev:'Open containers\nDamaged IBC/drums\nIncorrect segregation\nMissing labels\nInsufficient containment',ref:'PGS 15\nBAL / permit context\nInternal chemical storage rules',esc:'Escalate immediately for active leakage, incompatible storage, unknown chemicals or blocked emergency equipment.'},['Packaging damage','Leakage/spillage','Incorrect segregation','Missing label','Missing SDS/reference','Insufficient containment','Incompatible storage','Housekeeping','Fire safety','Emergency equipment'],[{id:uid('fld'),label:'Substance / product name',type:'shortText'},{id:uid('fld'),label:'Packaging type',type:'dropdown',options:['IBC','Drum','Jerrycan','Small packaging','Waste container']},{id:uid('fld'),label:'Estimated quantity',type:'shortText'}]),

/* ===== Back-button trap =================================================== */
/* Android/PWA: a fullscreen overlay must be dismissed by Back, not leave the app. */
let backTraps=[],trapSuppress=0;
function onTrapPop(){if(trapSuppress>0){trapSuppress--;return}const t=backTraps.pop();if(!backTraps.length)window.removeEventListener('popstate',onTrapPop);if(t){t.pushed=false;t.close()}}
function pushBackTrap(name,close){const t={name,close,pushed:false};try{history.pushState({trap:name,at:backTraps.length},'');t.pushed=true}catch(e){}backTraps.push(t);if(backTraps.length===1)window.addEventListener('popstate',onTrapPop);return t}
function releaseBackTrap(t){if(!t)return;const i=backTraps.indexOf(t);if(i<0)return;const dropped=backTraps.splice(i);if(!backTraps.length)window.removeEventListener('popstate',onTrapPop);const steps=dropped.filter(x=>x.pushed).length;dropped.forEach(x=>x.pushed=false);if(steps>0){trapSuppress++;setTimeout(()=>{if(trapSuppress>0)trapSuppress--},800);try{history.go(-steps)}catch(e){trapSuppress=Math.max(0,trapSuppress-1)}}}

function lightboxDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}

  document.body.classList.add('lb-open');

  const stage=box.querySelector('.lightbox-stage');
  stage.addEventListener('wheel',e=>{e.preventDefault();zoomPhoto(e.deltaY<0?1.12:.89)},{passive:false});
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){e.preventDefault();lightboxStartDistance=lightboxDistance(e.touches[0],e.touches[1]);lbDrag=null}
    else if(e.touches.length===1){const t=e.touches[0];lbDrag={x:t.clientX,y:t.clientY,px:lbPanX,py:lbPanY,moved:false}}
  },{passive:false});
  stage.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&lightboxStartDistance){e.preventDefault();const d=lightboxDistance(e.touches[0],e.touches[1]);if(d>0){zoomPhoto(d/lightboxStartDistance);lightboxStartDistance=d}return}
    if(e.touches.length===1&&lbDrag){
      const t=e.touches[0],dx=t.clientX-lbDrag.x,dy=t.clientY-lbDrag.y;
      if(Math.abs(dx)>8||Math.abs(dy)>8)lbDrag.moved=true;
      if(lightboxZoom>1){e.preventDefault();lbPanX=lbDrag.px+dx;lbPanY=lbDrag.py+dy;applyPhotoZoom()}
      else if(Math.abs(dx)>Math.abs(dy))e.preventDefault();
    }
  },{passive:false});
  stage.addEventListener('touchend',e=>{
    if(e.touches.length<2)lightboxStartDistance=null;
    const d=lbDrag;lbDrag=null;
    if(e.changedTouches.length!==1)return;
    const t=e.changedTouches[0];
    if(d&&d.moved){
      lbSuppressClick=true;setTimeout(()=>{lbSuppressClick=false},400);
      if(lightboxZoom<=1){const dx=t.clientX-d.x,dy=t.clientY-d.y;
        if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();lightboxLastTap=0;lightboxGo(dx<0?1:-1)}}
      return;
    }
    const n=Date.now();
    if(n-lightboxLastTap<300){e.preventDefault();lbSuppressClick=true;setTimeout(()=>{lbSuppressClick=false},400);lightboxZoom=lightboxZoom===1?2:1;lbPanX=0;lbPanY=0;applyPhotoZoom();lightboxLastTap=0;return}
    lightboxLastTap=n;
  },{passive:false});
  stage.addEventListener('click',e=>{if(e.target===stage&&!lbSuppressClick&&lightboxZoom<=1)closePhotoLightbox()});

  document.addEventListener('keydown',lightboxKey);
  lbTrap=pushBackTrap('lightbox',()=>{lbTrap=null;closePhotoLightbox()});

  await lightboxShow(lbIndex,1);
  lbStrip(token);
}

function lightboxKey(e){
  if(!document.getElementById('photoLightbox'))return;
  if(e.key==='Escape'){e.preventDefault();closePhotoLightbox()}
  else if(e.key==='ArrowRight'){e.preventDefault();lightboxGo(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();lightboxGo(-1)}
  else if(e.key==='+'||e.key==='='){e.preventDefault();zoomPhoto(1.25)}
  else if(e.key==='-'){e.preventDefault();zoomPhoto(.8)}
  else if(e.key==='0'){e.preventDefault();resetPhotoZoom()}
}

async function lbResolve(n){const e=lbList[n];if(!e)return null;if(e.src)return e;if(!e.id)return null;const p=await loadPhoto(e.id).catch(()=>null);if(!p)return null;e.src=p.dataUrl||p.thumbDataUrl;e.thumb=p.thumbDataUrl||p.dataUrl;e.caption=p.caption||'Photo';return e.src?e:null}

/* Show index n; if that photo is gone, keep stepping in `dir` until one loads. */
async function lightboxShow(n,dir=1){
  const token=lbToken;
  if(!lbList.length)return closePhotoLightbox();
  let i=((n%lbList.length)+lbList.length)%lbList.length;
  for(let k=0;k<lbList.length;k++){
    const e=await lbResolve(i);
    if(token!==lbToken)return;
    if(e){lbIndex=i;resetPhotoZoom();lbRender();return}
    i=((i+dir)%lbList.length+lbList.length)%lbList.length;
  }
  closePhotoLightbox();
}
function lightboxGo(delta){return lightboxShow(lbIndex+delta,delta>=0?1:-1)}

function lbRender(){
  const box=document.getElementById('photoLightbox');if(!box)return;
  const e=lbList[lbIndex]||{},multi=lbList.length>1;
  const img=box.querySelector('#lightboxImg');if(img&&img.getAttribute('src')!==e.src)img.src=e.src||'';
  box.querySelector('[data-lb-caption]').textContent=e.caption||'Photo';
  box.querySelector('[data-lb-count]').textContent=multi?`${lbIndex+1} / ${lbList.length}`:'';
  box.querySelector('[data-lb-nav]').style.display=multi?'':'none';
  box.querySelectorAll('[data-lb-thumb]').forEach(b=>b.classList.toggle('active',Number(b.dataset.lbThumb)===lbIndex));
}

/* Thumbnail filmstrip so any other photo is one tap away. */
async function lbStrip(token){
  const strip=document.querySelector('#photoLightbox [data-lb-strip]');if(!strip)return;
  if(lbList.length<2){strip.style.display='none';return}
  strip.innerHTML='';
  for(let n=0;n<lbList.length;n++){
    const e=lbList[n];
    if(!e.thumb&&e.id){const p=await loadPhoto(e.id).catch(()=>null);if(p)e.thumb=p.thumbDataUrl||p.dataUrl}
    if(token!==lbToken||!document.getElementById('photoLightbox'))return;
    const src=e.thumb||e.src;if(!src)continue;
    const b=document.createElement('button');b.type='button';b.className='lb-thumb'+(n===lbIndex?' active':'');b.dataset.lbThumb=n;
    b.innerHTML=`<img src="${src}" alt="">`;
    b.onclick=()=>lightboxShow(n);
    strip.appendChild(b);
  }
  const cur=strip.querySelector('.lb-thumb.active');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});
}

function closePhotoLightbox(){
  const box=document.getElementById('photoLightbox');
  document.removeEventListener('keydown',lightboxKey);
  if(box)box.remove();
  document.body.classList.remove('lb-open');
  lbToken++;lbList=[];lbIndex=0;lightboxZoom=1;lbPanX=0;lbPanY=0;lbDrag=null;lightboxStartDistance=null;
  const t=lbTrap;lbTrap=null;releaseBackTrap(t);
}
